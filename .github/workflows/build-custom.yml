name: Build custom image

# 自有分支 custom 的镜像构建：推送即检查、构建并发布到 GHCR。
# 这是独立文件，不修改上游的 nightly.yml / ci.yml，合并上游时不会产生冲突。

on:
  push:
    branches: [custom]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ppanel-server

# 同一分支连续推送时只保留最新一次构建。
concurrency:
  group: build-custom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 发布闸门：只检查会影响镜像的部分（编译、vet、计费模块测试）。
  # 不复用上游的 checks.yml：其中 govulncheck、proto 同步、数据库迁移测试在上游
  # master 上本来就是红的，复用会让镜像永远发布不出去。
  verify:
    name: Build, vet and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and vet
        run: |
          go build ./...
          go vet ./...

      - name: Test billing module
        run: go test ./internal/module/billing/...

  publish:
    name: Publish custom image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # BUILD_TIME 采用 script/ldflags.sh 接受的格式；VERSION 带上提交短哈希，
      # 管理面板里能直接看出跑的是哪个提交。
      - name: Resolve build metadata
        run: |
          echo "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::8}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # CHANNEL 只接受 stable/beta/nightly/dev（script/ldflags.sh），且只决定面板里
      # 显示的后缀；stable 不带后缀，真实标识放在 VERSION 里。
      # 仅 amd64：服务器是 x86，arm64 在 QEMU 下构建会拖慢每次推送。
      # 同时发布滚动标签 custom 与不可变标签 custom-<sha>；部署时固定使用后者，
      # 回退到上一版只需改回上一个 sha。
      - name: Build and push the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=custom-${{ env.SHORT_SHA }}
            CHANNEL=stable
            BUILD_TIME=${{ env.BUILD_TIME }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:custom
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:custom-${{ env.SHORT_SHA }}
